# Builds, tests, and publishes snapshot or release artifacts.
name: Build & Publish

on:
  workflow_call:
    inputs:
      release:
        description: 'Whether to publish a release instead of an alpha snapshot'
        required: true
        type: boolean
      version:
        description: 'Release version; snapshot versions are resolved from Gradle'
        required: false
        type: string
        default: ''
      changelog:
        description: 'Changelog supplied to distribution platforms'
        required: true
        type: string
    secrets:
      MAVEN_USERNAME:
        required: true
      MAVEN_PASSWORD:
        required: true
      BONES_API_KEY:
        required: true
      MODRINTH_TOKEN:
        required: true
      HANGAR_API_KEY:
        required: true
      CURSEFORGE_TOKEN:
        required: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository 🛠️'
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 'Set up JDKs 21 & 25 📦'
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - name: 'Set up Gradle 📦'
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: 'Build with Gradle 🏗️'
        id: build
        env:
          IS_RELEASE: ${{ inputs.release }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            export RELEASES_MAVEN_USERNAME="$MAVEN_USERNAME"
            export RELEASES_MAVEN_PASSWORD="$MAVEN_PASSWORD"
          else
            export SNAPSHOTS_MAVEN_USERNAME="$MAVEN_USERNAME"
            export SNAPSHOTS_MAVEN_PASSWORD="$MAVEN_PASSWORD"
          fi
          ./gradlew build publish --build-cache
      - name: 'Publish Test Report 📊'
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
      - name: 'Resolve Version Name 📝'
        id: version
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          IS_RELEASE: ${{ inputs.release }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            version="$RELEASE_VERSION"
            version_type="release"
          else
            version="$(./gradlew properties --no-daemon --console=plain -q | awk '/^version:/ { print $2; exit }')"
            version_type="alpha"
          fi
          if [[ -z "$version" ]]; then
            echo "Unable to resolve the publish version" >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "type=$version_type" >> "$GITHUB_OUTPUT"
      - name: 'Publish to William278.net 🚀'
        uses: WiIIiam278/bones-publish-action@v1
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          api-key: ${{ secrets.BONES_API_KEY }}
          project: 'huskhomes'
          channel: ${{ steps.version.outputs.type }}
          version: ${{ steps.version.outputs.name }}
          changelog: ${{ inputs.changelog }}
          distro-names: |
            paper
            fabric-1.21.1
            fabric-1.21.11
            fabric-26.1.2
            fabric-26.2
          distro-groups: |
            paper
            fabric
            fabric
            fabric
            fabric
          distro-descriptions: |
            Paper
            Fabric 1.21.1
            Fabric 1.21.11
            Fabric 26.1.2
            Fabric 26.2
          files: |
            target/HuskHomes-Paper-${{ steps.version.outputs.name }}.jar
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.1.21.1.jar
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.1.21.11.jar
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.26.1.2.jar
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.26.2.jar
      - name: 'Spigot: Publish to Modrinth & Hangar 🚰'
        uses: WiIIiam278/mc-publish@hangar
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          modrinth-id: J6U9o3JG
          modrinth-featured: false
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: |
            dynmap | suggests | *
            bluemap | suggests | *
            pl3xmap | suggests | *
            plan | suggests | *
          hangar-id: William278/HuskHomes
          hangar-token: ${{ secrets.HANGAR_API_KEY }}
          hangar-version-type: ${{ steps.version.outputs.type }}
          files-primary: target/HuskHomes-Paper-${{ steps.version.outputs.name }}.jar
          name: HuskHomes (Spigot) v${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.name }}
          version-type: ${{ steps.version.outputs.type }}
          changelog: ${{ inputs.changelog }}
          loaders: |
            spigot
            paper
            folia
          game-versions: |
            1.20.1
            1.20.2
            1.20.3
            1.20.4
            1.20.5
            1.20.6
            1.21
            1.21.1
            1.21.2
            1.21.4
            1.21.5
            1.21.6
            1.21.8
            1.21.11
            26.1.1
            26.1.2
            26.2
          java: 17
      - name: 'Fabric 1.21.1: Publish to Modrinth & CurseForge 🧵'
        uses: Kira-NT/mc-publish@v3
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          modrinth-id: J6U9o3JG
          modrinth-featured: false
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 849217
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dependencies: |
            fabric-api | requires | *
            dynmap | suggests | *
            bluemap | suggests | *
            pl3xmap | suggests | *
            luckperms | suggests | *
            plan | suggests | *
            impactor | suggests | *
            placeholder-api | suggests | *
          files: |
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.1.21.1.jar
          name: HuskHomes (Fabric) v${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.name }}
          version-type: ${{ steps.version.outputs.type }}
          changelog: ${{ inputs.changelog }}
          environment: server
          loaders: |
            fabric
          game-versions: |
            1.21.1
          java: 21
      - name: 'Fabric 1.21.11: Publish to Modrinth & CurseForge 🧵'
        uses: Kira-NT/mc-publish@v3
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          modrinth-id: J6U9o3JG
          modrinth-featured: false
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 849217
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dependencies: |
            fabric-api | requires | *
            dynmap | suggests | *
            bluemap | suggests | *
            pl3xmap | suggests | *
            luckperms | suggests | *
            plan | suggests | *
            impactor | suggests | *
            placeholder-api | suggests | *
          files: |
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.1.21.11.jar
          name: HuskHomes (Fabric) v${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.name }}
          version-type: ${{ steps.version.outputs.type }}
          changelog: ${{ inputs.changelog }}
          environment: server
          loaders: |
            fabric
          game-versions: |
            1.21.11
          java: 21
      - name: 'Fabric 26.1.2: Publish to Modrinth & CurseForge 🧵'
        uses: Kira-NT/mc-publish@v3
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          modrinth-id: J6U9o3JG
          modrinth-featured: false
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 849217
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dependencies: |
            fabric-api | requires | *
            dynmap | suggests | *
            bluemap | suggests | *
            pl3xmap | suggests | *
            luckperms | suggests | *
            plan | suggests | *
            impactor | suggests | *
            placeholder-api | suggests | *
          files: |
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.26.1.2.jar
          name: HuskHomes (Fabric) v${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.name }}
          version-type: ${{ steps.version.outputs.type }}
          changelog: ${{ inputs.changelog }}
          environment: server
          loaders: |
            fabric
          game-versions: |
            26.1.2
          java: 25
      - name: 'Fabric 26.2: Publish to Modrinth & CurseForge 🧵'
        uses: Kira-NT/mc-publish@v3
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        with:
          modrinth-id: J6U9o3JG
          modrinth-featured: false
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 849217
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          dependencies: |
            fabric-api | requires | *
            dynmap | suggests | *
            bluemap | suggests | *
            pl3xmap | suggests | *
            luckperms | suggests | *
            plan | suggests | *
            impactor | suggests | *
            placeholder-api | suggests | *
          files: |
            target/HuskHomes-Fabric-${{ steps.version.outputs.name }}+mc.26.2.jar
          name: HuskHomes (Fabric) v${{ steps.version.outputs.name }}
          version: ${{ steps.version.outputs.name }}
          version-type: ${{ steps.version.outputs.type }}
          changelog: ${{ inputs.changelog }}
          environment: server
          loaders: |
            fabric
          game-versions: |
            26.2
          java: 25
