# Builds, tests, and publishes alpha snapshots from the default branch.
name: CI Tests & Publish

on:
  push:
    branches: [ 'master' ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'

permissions:
  contents: read
  checks: write

jobs:
  publish:
    uses: ./.github/workflows/_build_and_publish.yml
    with:
      release: false
      changelog: ${{ github.event.head_commit.message }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      BONES_API_KEY: ${{ secrets.BONES_API_KEY }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
