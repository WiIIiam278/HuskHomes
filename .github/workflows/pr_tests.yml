# Carry out tests on pull requests
name: PR Tests

on:
  pull_request:
    branches: [ 'master' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout for CI 🛎'
        uses: actions/checkout@v6
      - name: 'Set up JDKs 21 & 25 📦'
        uses: actions/setup-java@v5
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - name: 'Set up Gradle 📦'
        uses: gradle/actions/setup-gradle@v6.3.0
      - name: 'Build with Gradle 🏗️'
        run: ./gradlew build --build-cache
      - name: 'Upload PR Build Artifacts 📤'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: HuskHomes-PR-${{ github.event.pull_request.number }}-attempt-${{ github.run_attempt }}
          path: |
            target/HuskHomes-Paper-*.jar
            target/HuskHomes-Fabric-*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: 'Publish Test Report 📊'
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
