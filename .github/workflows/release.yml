# Builds, tests, and publishes artifacts when a GitHub release is published.
name: Release Test & Publish

on:
  release:
    types: [ published ]

permissions:
  contents: read
  checks: write

jobs:
  publish:
    uses: ./.github/workflows/_build_and_publish.yml
    with:
      release: true
      version: ${{ github.event.release.tag_name }}
      changelog: ${{ github.event.release.body }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      BONES_API_KEY: ${{ secrets.BONES_API_KEY }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_API_KEY: ${{ secrets.HANGAR_API_KEY }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
