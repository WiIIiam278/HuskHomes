pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.kikugie.dev/releases' }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    id 'dev.kikugie.loom-back-compat' version '0.4.3'
}

rootProject.name = 'HuskHomes'
include(
        'common',

        // Paper/Spigot
        'bukkit',
        'paper',

        // Fabric (versions are registered by Stonecutter below)
        'fabric',
)

stonecutter {
    create(':fabric') {
        versions '1.21.1', '1.21.11', '26.2', '26.3'
        vcsVersion = '26.3'
    }
}
